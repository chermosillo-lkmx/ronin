appId: com.ronin.desktop
productName: Ronin
directories:
  output: release
  buildResources: desktop/build
files:
  - desktop/dist/**/*
  - web/dist/**/*
  - server/dist/**/*
  - server/data/actions.json
  - server/data/clickup-seed.json
  - server/data/jira-seed.json
  - server/data/prompts.json
  - server/data/workflow.json
  - package.json
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
linux:
  category: Development
  target:
    - AppImage
    - deb
publish: null
